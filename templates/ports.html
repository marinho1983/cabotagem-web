{% extends "layout.html" %}
{% block content %}
<h2>Portos/Terminais</h2>

<form method="post" class="card">
  <div class="row">
    <input name="name" placeholder="Nome do porto/terminal" required>
    <button type="submit">Salvar</button>
  </div>
</form>

<table>
  <thead><tr><th>Porto</th></tr></thead>
  <tbody>
    {% for x in items %}
      <tr><td>{{ x.name }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
