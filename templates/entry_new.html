{% extends "layout.html" %}
{% block content %}
<h2>Lançar despesa</h2>
<p><b>{{ op.operation_key }}</b></p>

<form method="post" class="card">
  <div class="row">
    <select name="supplier_id">
      <option value="0">Fornecedor (opcional: se vazio, usa agência da operação)</option>
      {% for s in suppliers %}
        <option value="{{ s.id }}">{{ s.name }} ({{ s.supplier_type }})</option>
      {% endfor %}
    </select>

    <input name="document_type" placeholder="Doc (Antec./ND/NFE...)">
    <input name="po" placeholder="PO">
    <input name="rqa" placeholder="RQA">
    <input name="reference_number" placeholder="Reference Number">

    <input name="service_name" placeholder="Serviço (ex: Praticagem / Diversos)">
    <input name="description" placeholder="Descrição livre">

    <input name="currency" placeholder="Moeda (BRL/USD/EUR)" value="BRL" required>
    <input name="amount_original" placeholder="Valor (moeda original)" required>
    <input name="roe" placeholder="ROE (se moeda != BRL)">

    <input name="issuance_date" type="date">
    <input name="due_date" type="date">
    <input name="status" placeholder="Status (to be approved...)">

    <button type="submit">Salvar</button>
  </div>
</form>
{% endblock %}
